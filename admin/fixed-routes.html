<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Routes | BeePilot Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 flex min-h-screen">
    <aside class="w-64 bg-charcoal text-white hidden lg:flex flex-col fixed inset-y-0">
        <div class="p-8">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-honey rounded-lg flex items-center justify-center">
                    <i data-lucide="navigation" class="text-charcoal w-5 h-5"></i>
                </div>
                <span class="text-xl font-black tracking-tighter">BEEPILOT</span>
            </div>
        </div>
        <nav class="flex-1 px-4 space-y-2 mt-4">
            <a href="dashboard.html" class="sidebar-link flex items-center gap-3 p-3 rounded-xl font-bold text-gray-400 hover:text-white transition-all">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
            </a>
            <a href="fixed-routes.html" class="sidebar-link active bg-honey text-charcoal flex items-center gap-3 p-3 rounded-xl font-bold transition-all">
                <i data-lucide="map" class="w-5 h-5"></i> Fixed Routes
            </a>
            <a href="fares.html" class="sidebar-link flex items-center gap-3 p-3 rounded-xl font-bold text-gray-400 hover:text-white transition-all">
                <i data-lucide="settings-2" class="w-5 h-5"></i> Fare Settings
            </a>
        </nav>
    </aside>

    <main class="flex-1 lg:ml-64 p-8">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-3xl font-black">Fixed Routes</h1>
                <p class="text-gray-500">Popular predefined destinations</p>
            </div>
            <button class="btn-primary py-2 px-6 shadow-lg shadow-honey/20">+ Add Route</button>
        </header>

        <div class="grid gap-6">
            <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between">
                <div class="flex items-center gap-6">
                    <div class="w-12 h-12 bg-gray-50 rounded-xl flex items-center justify-center text-honey">
                        <i data-lucide="arrow-right-left"></i>
                    </div>
                    <div>
                        <h4 class="font-black">Mbarara ↔ Entebbe Airport</h4>
                        <p class="text-xs text-gray-500">270km • One-way Fixed</p>
                    </div>
                </div>
                <div class="flex items-center gap-12">
                    <div class="text-right">
                        <p class="text-[10px] font-black text-gray-400 uppercase">Fare</p>
                        <p class="font-black">UGX 230,000</p>
                    </div>
                    <button class="text-gray-400 hover:text-honey"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between">
                <div class="flex items-center gap-6">
                    <div class="w-12 h-12 bg-gray-50 rounded-xl flex items-center justify-center text-honey">
                        <i data-lucide="arrow-right-left"></i>
                    </div>
                    <div>
                        <h4 class="font-black">Mbarara ↔ Kampala (City Center)</h4>
                        <p class="text-xs text-gray-500">265km • Executive Saloon</p>
                    </div>
                </div>
                <div class="flex items-center gap-12">
                    <div class="text-right">
                        <p class="text-[10px] font-black text-gray-400 uppercase">Fare</p>
                        <p class="font-black">UGX 210,000</p>
                    </div>
                    <button class="text-gray-400 hover:text-honey"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                </div>
            </div>
        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
