<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Login | BeePilot Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-midnight min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-honey rounded-2xl flex items-center justify-center mx-auto mb-6">
                <i data-lucide="shield-check" class="text-charcoal w-8 h-8"></i>
            </div>
            <h1 class="text-white text-3xl font-black mb-2">BeePilot Admin</h1>
            <p class="text-gray-400">Secure owner access only</p>
        </div>

        <div class="bg-white rounded-[2rem] p-8 shadow-2xl">
            <form id="login-form" class="space-y-6">
                <div>
                    <label class="text-gray-500 uppercase tracking-widest text-[10px] font-black mb-2 block">Admin Access PIN</label>
                    <input type="password" id="admin-pin"
                           class="text-center text-3xl tracking-[1em] font-black py-4 border-2 focus:border-honey"
                           maxlength="4" placeholder="••••" required>
                </div>

                <div id="login-error" class="hidden p-4 bg-red-50 text-red-600 rounded-xl text-sm font-bold text-center">
                    Invalid PIN. Please try again.
                </div>

                <button type="submit" class="btn-primary w-full py-4 text-lg">
                    Enter Dashboard
                </button>
            </form>

            <p class="text-center text-gray-400 text-xs mt-8">
                Demo PIN: <span class="font-bold text-charcoal">1234</span>
            </p>
        </div>

        <div class="mt-8 text-center">
            <a href="../index.html" class="text-gray-500 hover:text-honey text-sm font-bold flex items-center justify-center gap-2">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to public site
            </a>
        </div>
    </div>

    <script type="module">
        lucide.createIcons();

        const form = document.getElementById('login-form');
        const pinInput = document.getElementById('admin-pin');
        const errorMsg = document.getElementById('login-error');

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            // Static demo logic
            if (pinInput.value === '1234') {
                sessionStorage.setItem('bp_admin_auth', 'true');
                window.location.href = 'dashboard.html';
            } else {
                errorMsg.classList.remove('hidden');
                pinInput.value = '';
                pinInput.focus();
            }
        });
    </script>
</body>
</html>
