<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | BeePilot Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .sidebar-link.active {
            background-color: var(--honey-gold);
            color: var(--charcoal);
        }
    </style>
</head>
<body class="bg-gray-50 flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-charcoal text-white hidden lg:flex flex-col fixed inset-y-0">
        <div class="p-8">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-honey rounded-lg flex items-center justify-center">
                    <i data-lucide="navigation" class="text-charcoal w-5 h-5"></i>
                </div>
                <span class="text-xl font-black tracking-tighter">BEEPILOT</span>
            </div>
        </div>

        <nav class="flex-1 px-4 space-y-2 mt-4">
            <a href="dashboard.html" class="sidebar-link active flex items-center gap-3 p-3 rounded-xl font-bold transition-all">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
            </a>
            <a href="#" class="sidebar-link flex items-center gap-3 p-3 rounded-xl font-bold text-gray-400 hover:text-white transition-all">
                <i data-lucide="calendar" class="w-5 h-5"></i> Bookings
            </a>
            <a href="#" class="sidebar-link flex items-center gap-3 p-3 rounded-xl font-bold text-gray-400 hover:text-white transition-all">
                <i data-lucide="credit-card" class="w-5 h-5"></i> Payments
            </a>
            <a href="#" class="sidebar-link flex items-center gap-3 p-3 rounded-xl font-bold text-gray-400 hover:text-white transition-all">
                <i data-lucide="users" class="w-5 h-5"></i> Customers
            </a>
            <a href="#" class="sidebar-link flex items-center gap-3 p-3 rounded-xl font-bold text-gray-400 hover:text-white transition-all">
                <i data-lucide="settings-2" class="w-5 h-5"></i> Fare Settings
            </a>
            <a href="#" class="sidebar-link flex items-center gap-3 p-3 rounded-xl font-bold text-gray-400 hover:text-white transition-all">
                <i data-lucide="map" class="w-5 h-5"></i> Fixed Routes
            </a>
        </nav>

        <div class="p-4 border-t border-white/10">
            <button id="logout-btn" class="flex items-center gap-3 p-3 text-gray-400 hover:text-white font-bold w-full">
                <i data-lucide="log-out" class="w-5 h-5"></i> Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 lg:ml-64 p-8">
        <!-- Top Nav -->
        <header class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-3xl font-black">Dashboard</h1>
                <p class="text-gray-500">Welcome back, Owner</p>
            </div>
            <div class="flex items-center gap-4">
                <button class="p-2 bg-white rounded-xl shadow-sm border border-gray-100"><i data-lucide="bell"></i></button>
                <div class="w-10 h-10 bg-honey rounded-full flex items-center justify-center font-black">BP</div>
            </div>
        </header>

        <!-- KPI Cards -->
        <div class="grid md:grid-cols-4 gap-6 mb-12">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                <p class="text-gray-400 text-xs font-bold uppercase mb-2">Today's Bookings</p>
                <h3 class="text-3xl font-black" id="stat-today">0</h3>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                <p class="text-gray-400 text-xs font-bold uppercase mb-2">Awaiting Deposit</p>
                <h3 class="text-3xl font-black text-honey" id="stat-awaiting">0</h3>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                <p class="text-gray-400 text-xs font-bold uppercase mb-2">Confirmed Trips</p>
                <h3 class="text-3xl font-black text-sage" id="stat-confirmed">0</h3>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                <p class="text-gray-400 text-xs font-bold uppercase mb-2">Monthly Revenue</p>
                <h3 class="text-3xl font-black" id="stat-revenue">UGX 0</h3>
            </div>
        </div>

        <!-- Recent Bookings Table -->
        <div class="bg-white rounded-[2rem] shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-8 border-b border-gray-50 flex justify-between items-center">
                <h2 class="text-xl font-black">Recent Bookings</h2>
                <div class="flex gap-2">
                    <div class="relative">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                        <input type="text" placeholder="Search..." class="pl-10 pr-4 py-2 bg-gray-50 border-none rounded-xl text-sm w-64">
                    </div>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 text-gray-400 text-[10px] font-black uppercase tracking-widest">
                        <tr>
                            <th class="px-8 py-4">Code</th>
                            <th class="px-8 py-4">Customer</th>
                            <th class="px-8 py-4">Route</th>
                            <th class="px-8 py-4">Date & Time</th>
                            <th class="px-8 py-4">Fare</th>
                            <th class="px-8 py-4">Status</th>
                            <th class="px-8 py-4">Action</th>
                        </tr>
                    </thead>
                    <tbody id="bookings-table-body" class="divide-y divide-gray-50">
                        <!-- Bookings will be loaded here -->
                        <tr>
                            <td colspan="7" class="px-8 py-20 text-center text-gray-400 italic">No bookings found</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module">
        import { BookingRepository } from '../js/repositories/booking_repository.js';
        import { formatCurrency, formatDate, formatTime } from '../js/utils/helpers.js';

        lucide.createIcons();

        // Auth check
        if (!sessionStorage.getItem('bp_admin_auth')) {
            window.location.href = 'login.html';
        }

        document.getElementById('logout-btn').addEventListener('click', () => {
            sessionStorage.removeItem('bp_admin_auth');
            window.location.href = 'login.html';
        });

        const repo = new BookingRepository();
        const bookings = repo.getAll();

        const tableBody = document.getElementById('bookings-table-body');

        // Update Stats
        document.getElementById('stat-today').textContent = bookings.length;
        document.getElementById('stat-awaiting').textContent = bookings.filter(b => b.status === 'awaiting_confirmation').length;

        if (bookings.length > 0) {
            tableBody.innerHTML = '';
            bookings.reverse().forEach(b => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition-colors cursor-pointer';
                tr.innerHTML = `
                    <td class="px-8 py-6 font-bold text-sm">${b.id}</td>
                    <td class="px-8 py-6">
                        <div class="font-bold text-sm">${b.customerName}</div>
                        <div class="text-xs text-gray-400">${b.customerPhone}</div>
                    </td>
                    <td class="px-8 py-6 text-sm">${b.pickupLocation} → ${b.destination}</td>
                    <td class="px-8 py-6 text-sm">${formatDate(b.date)} at ${formatTime(b.time)}</td>
                    <td class="px-8 py-6 font-bold text-sm">${formatCurrency(b.totalFare)}</td>
                    <td class="px-8 py-6">
                        <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase bg-honey/10 text-honey">
                            ${b.status.replace('_', ' ')}
                        </span>
                    </td>
                    <td class="px-8 py-6">
                        <button class="text-honey hover:underline text-sm font-bold">View</button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
