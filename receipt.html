<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Booking Status | BEEPILOT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#10161B',
                        navy: '#10233E',
                        ivory: '#FBF8F1',
                        gold: '#F2B928',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-ivory text-ink min-h-screen">
    <header class="fixed top-0 w-full z-50 glass-nav">
        <nav class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <div class="w-8 h-8 bg-gold rounded-lg flex items-center justify-center">
                    <i data-lucide="navigation" class="text-ink w-5 h-5"></i>
                </div>
                <span class="text-xl font-black tracking-tighter">BEEPILOT</span>
            </a>
            <button id="download-btn" class="btn-primary px-4 py-2 text-xs font-black hidden">
                <i data-lucide="download" class="w-3 h-3"></i> DOWNLOAD
            </button>
        </nav>
    </header>

    <main class="pt-28 pb-20 container max-w-2xl mx-auto px-6">
        <div id="receipt-content" class="bg-white rounded-[2rem] shadow-xl border border-border overflow-hidden">
            <!-- Status Header -->
            <div class="p-8 md:p-10 border-b border-border text-center">
                <div id="status-icon" class="w-16 h-16 bg-gold/10 rounded-2xl flex items-center justify-center mx-auto mb-6">
                    <i data-lucide="clock" class="text-gold w-8 h-8 animate-pulse"></i>
                </div>
                <h1 id="status-title" class="text-2xl font-black mb-2">Awaiting Payment</h1>
                <p id="status-desc" class="text-xs text-text-muted font-bold uppercase tracking-widest">Ref: #BP-LOADING</p>
            </div>

            <!-- Booking Details -->
            <div class="p-8 md:p-10 space-y-8">
                <div class="grid grid-cols-2 gap-8">
                    <div>
                        <p class="text-[10px] font-black text-text-muted uppercase tracking-widest mb-2">Traveler</p>
                        <p class="font-bold text-sm" id="client-name">---</p>
                    </div>
                    <div>
                        <p class="text-[10px] font-black text-text-muted uppercase tracking-widest mb-2">Travel Date</p>
                        <p class="font-bold text-sm" id="travel-date">---</p>
                    </div>
                </div>

                <div>
                    <p class="text-[10px] font-black text-text-muted uppercase tracking-widest mb-4">Route</p>
                    <div class="space-y-4">
                        <div class="flex items-center gap-3">
                            <div class="w-2 h-2 rounded-full bg-gold"></div>
                            <p class="text-xs font-bold" id="pickup">---</p>
                        </div>
                        <div class="w-px h-4 bg-border ml-1"></div>
                        <div class="flex items-center gap-3">
                            <div class="w-2 h-2 rounded-full bg-navy"></div>
                            <p class="text-xs font-bold" id="destination">---</p>
                        </div>
                    </div>
                </div>

                <div class="bg-navy rounded-2xl p-8 text-white relative overflow-hidden">
                    <div class="relative z-10 flex justify-between items-end">
                        <div>
                            <p class="text-gold text-[10px] font-black uppercase tracking-widest mb-2">Total Amount</p>
                            <h2 class="text-3xl font-black" id="total-fare">UGX 0</h2>
                        </div>
                        <div class="text-right">
                            <p class="text-white/40 text-[10px] font-bold uppercase mb-1">Status</p>
                            <p class="font-bold text-xs" id="payment-text">UNPAID</p>
                        </div>
                    </div>
                    <i data-lucide="receipt" class="absolute -bottom-8 -right-8 w-32 h-32 text-white/5 -rotate-12"></i>
                </div>
            </div>

            <!-- Footer Info -->
            <div class="bg-ivory p-6 text-center border-t border-border">
                <p class="text-[10px] font-bold text-text-muted uppercase tracking-widest">BeePilot Global Operations</p>
            </div>
        </div>

        <div class="mt-10 space-y-4">
            <button id="whatsapp-status-btn" class="btn-primary w-full py-5 text-lg font-black shadow-xl">
                Update Status via WhatsApp
            </button>
            <a href="index.html" class="block text-center text-xs font-bold text-text-muted hover:text-navy transition-colors">Return Home</a>
        </div>
    </main>

    <script type="module">
        import { CONFIG } from './js/config.js';
        import { ApiService } from './js/services/api_service.js';
        import { formatCurrency, formatDate, formatTime } from './js/utils/helpers.js';

        const params = new URLSearchParams(window.location.search);
        const bookingId = params.get('id');

        async function load() {
            lucide.createIcons();
            if (!bookingId) return window.location.href = 'index.html';

            try {
                const booking = await ApiService.getBooking(bookingId);

                document.getElementById('status-desc').textContent = `Ref: #${booking.id}`;
                document.getElementById('client-name').textContent = booking.customerName;
                document.getElementById('travel-date').textContent = `${formatDate(booking.date)} @ ${formatTime(booking.time)}`;
                document.getElementById('pickup').textContent = booking.pickupLocation;
                document.getElementById('destination').textContent = booking.destination;
                document.getElementById('total-fare').textContent = formatCurrency(booking.totalFare);

                if (booking.status === 'confirmed') {
                    document.getElementById('status-icon').innerHTML = '<i data-lucide="check-circle" class="text-green-500 w-8 h-8"></i>';
                    document.getElementById('status-title').textContent = 'Booking Confirmed';
                    document.getElementById('payment-text').textContent = 'PAID & VERIFIED';
                    document.getElementById('payment-text').classList.add('text-green-400');
                    document.getElementById('download-btn').classList.remove('hidden');
                    document.getElementById('whatsapp-status-btn').textContent = "Message Dispatch";
                }

                document.getElementById('whatsapp-status-btn').onclick = () => {
                    const msg = `🐝 *BOOKING STATUS CHECK*\nRef: ${booking.id}\nStatus: ${booking.status.toUpperCase()}\n\nI am checking on my ride for ${formatDate(booking.date)}.`;
                    window.open(`${CONFIG.WHATSAPP_LINK}?text=${encodeURIComponent(msg)}`, '_blank');
                };

                lucide.createIcons();
            } catch (e) {
                console.error(e);
                alert("Booking not found or network error.");
            }
        }

        document.getElementById('download-btn').onclick = () => {
            const element = document.getElementById('receipt-content');
            const opt = {
                margin: 0.5,
                filename: `BeePilot-Receipt-${bookingId}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        };

        load();
    </script>
</body>
</html>
