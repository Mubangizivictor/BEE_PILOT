<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Review & Payment | BEEPILOT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#10161B',
                        navy: '#10233E',
                        ivory: '#FBF8F1',
                        gold: '#F2B928',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-ivory text-ink min-h-screen">
    <header class="fixed top-0 w-full z-50 glass-nav">
        <nav class="max-w-7xl mx-auto px-5 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <div class="w-10 h-10 bg-gold rounded-lg flex items-center justify-center">
                    <i data-lucide="navigation" class="text-ink w-6 h-6"></i>
                </div>
                <span class="text-xl font-black tracking-tighter">BEEPILOT</span>
            </a>
            <a href="book.html" class="nav-link flex items-center gap-2 text-sm font-bold">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back
            </a>
        </nav>
    </header>

    <main class="pt-24 md:pt-32 pb-20 px-5 md:px-0 container max-w-6xl mx-auto">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 md:gap-12">
            <!-- Left: Review Card -->
            <div class="lg:col-span-2 space-y-8">
                <div>
                    <h1 class="text-3xl font-bold mb-2">Review Booking</h1>
                    <p class="text-sm text-text-muted">Ensure all trip details are correct before payment.</p>
                </div>

                <div class="card p-6 md:p-8 space-y-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div>
                            <p class="text-[10px] font-black text-text-muted uppercase tracking-widest mb-2">Pickup</p>
                            <p class="font-bold text-navy" id="display-pickup">---</p>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-text-muted uppercase tracking-widest mb-2">Destination</p>
                            <p class="font-bold text-navy" id="display-dest">---</p>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-text-muted uppercase tracking-widest mb-2">Date & Time</p>
                            <p class="font-bold text-navy" id="display-datetime">---</p>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-text-muted uppercase tracking-widest mb-2">Ride Info</p>
                            <p class="font-bold text-navy" id="display-details">---</p>
                        </div>
                    </div>
                </div>

                <!-- Fare Breakdown Card -->
                <div class="card bg-navy text-white border-none p-8 md:p-10 relative overflow-hidden">
                    <div class="relative z-10">
                        <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
                            <div>
                                <p class="text-gold text-[10px] font-black uppercase tracking-widest mb-2">Total Fixed Fare</p>
                                <h2 class="text-4xl md:text-5xl font-black" id="display-total-fare">UGX 0</h2>
                            </div>
                            <div class="flex gap-4">
                                <div class="bg-white/5 p-4 rounded-xl border border-white/10">
                                    <p class="text-white/40 text-[10px] font-bold uppercase mb-1">Deposit (30%)</p>
                                    <p class="text-xl font-bold text-gold" id="display-deposit">UGX 0</p>
                                </div>
                                <div class="bg-white/5 p-4 rounded-xl border border-white/10">
                                    <p class="text-white/40 text-[10px] font-bold uppercase mb-1">Balance Due</p>
                                    <p class="text-xl font-bold" id="display-balance">UGX 0</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <i data-lucide="wallet" class="absolute -bottom-10 -right-10 w-48 h-48 text-white/5 -rotate-12"></i>
                </div>
            </div>

            <!-- Right: Payment Methods -->
            <div class="space-y-8">
                <h3 class="text-xl font-bold">Select Payment</h3>
                <div class="space-y-3">
                    <label class="block cursor-pointer group">
                        <input type="radio" name="payment" value="momo" class="peer sr-only" checked>
                        <div class="p-5 bg-white border border-border rounded-xl peer-checked:border-gold peer-checked:bg-gold/5 transition-all">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 bg-yellow-400 rounded-lg flex items-center justify-center font-black text-[10px]">MTN</div>
                                <div>
                                    <p class="font-bold text-sm text-navy">MTN MoMo</p>
                                    <p class="text-[10px] text-text-muted">Instant payment to 0793128137</p>
                                </div>
                            </div>
                        </div>
                    </label>

                    <label class="block cursor-pointer group">
                        <input type="radio" name="payment" value="airtel" class="peer sr-only">
                        <div class="p-5 bg-white border border-border rounded-xl peer-checked:border-gold peer-checked:bg-gold/5 transition-all">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center font-black text-[10px] text-white">AIRTEL</div>
                                <div>
                                    <p class="font-bold text-sm text-navy">Airtel Money</p>
                                    <p class="text-[10px] text-text-muted">Instant payment to 0740116746</p>
                                </div>
                            </div>
                        </div>
                    </label>

                    <label class="block cursor-pointer group">
                        <input type="radio" name="payment" value="bank" class="peer sr-only">
                        <div class="p-5 bg-white border border-border rounded-xl peer-checked:border-gold peer-checked:bg-gold/5 transition-all">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 bg-navy rounded-lg flex items-center justify-center text-white"><i data-lucide="landmark" class="w-4 h-4"></i></div>
                                <div>
                                    <p class="font-bold text-sm text-navy">Bank Transfer</p>
                                    <p class="text-[10px] text-text-muted">Centenary: 3205381235</p>
                                </div>
                            </div>
                        </div>
                    </label>
                </div>

                <div id="instruction-card" class="p-6 bg-white border border-border rounded-2xl animate-in fade-in duration-500">
                    <h4 class="text-[10px] font-black text-text-muted uppercase tracking-widest mb-4">Payment Instructions</h4>
                    <div id="instructions" class="space-y-4"></div>
                </div>

                <button id="confirm-btn" class="btn-primary w-full py-5 text-lg font-black shadow-2xl shadow-gold/20">
                    Confirm & Open WhatsApp
                </button>

                <p class="text-center text-[11px] text-text-muted font-medium">
                    <i data-lucide="shield-check" class="inline w-3 h-3 mr-1 text-gold"></i>
                    Manual verification by BeePilot operations.
                </p>
            </div>
        </div>
    </main>

    <script type="module">
        import { CONFIG } from './js/config.js';
        import { ApiService } from './js/services/api_service.js';
        import { formatCurrency, formatDate, formatTime } from './js/utils/helpers.js';

        const booking = JSON.parse(localStorage.getItem('pending_booking'));
        if (!booking) window.location.href = 'book.html';

        function render() {
            lucide.createIcons();
            document.getElementById('display-pickup').textContent = booking.pickupLocation;
            document.getElementById('display-dest').textContent = booking.destination;
            document.getElementById('display-datetime').textContent = `${formatDate(booking.date)} @ ${formatTime(booking.time)}`;
            document.getElementById('display-details').textContent = `${booking.passengers} Pax, ${booking.bags} Bags • ${booking.serviceType.toUpperCase()}`;
            document.getElementById('display-total-fare').textContent = formatCurrency(booking.totalFare);
            document.getElementById('display-deposit').textContent = formatCurrency(booking.depositAmount);
            document.getElementById('display-balance').textContent = formatCurrency(booking.totalFare - booking.depositAmount);
            updateInstructions();
        }

        function updateInstructions() {
            const method = document.querySelector('input[name="payment"]:checked').value;
            const target = document.getElementById('instructions');

            let html = '';
            if (method === 'momo') {
                html = `<div class="p-4 bg-ivory rounded-xl border border-border">
                    <p class="text-xs font-bold text-navy mb-1">MTN Mobile Money</p>
                    <p class="text-lg font-black text-navy">${CONFIG.MTN_MOMO}</p>
                    <p class="text-[10px] text-text-muted">Name: ${CONFIG.ACCOUNT_NAME}</p>
                </div>`;
            } else if (method === 'airtel') {
                html = `<div class="p-4 bg-ivory rounded-xl border border-border">
                    <p class="text-xs font-bold text-navy mb-1">Airtel Money</p>
                    <p class="text-lg font-black text-navy">${CONFIG.AIRTEL_MONEY}</p>
                    <p class="text-[10px] text-text-muted">Name: ${CONFIG.ACCOUNT_NAME}</p>
                </div>`;
            } else {
                html = `<div class="p-4 bg-ivory rounded-xl border border-border">
                    <p class="text-xs font-bold text-navy mb-1">${CONFIG.BANK_NAME}</p>
                    <p class="text-lg font-black text-navy">${CONFIG.BANK_ACCOUNT}</p>
                    <p class="text-[10px] text-text-muted">Acc Name: ${CONFIG.ACCOUNT_NAME}</p>
                </div>`;
            }
            html += `<p class="text-[10px] italic text-gold font-bold">Ref: ${booking.id}</p>`;
            target.innerHTML = html;
        }

        document.querySelectorAll('input[name="payment"]').forEach(i => i.onchange = updateInstructions);

        document.getElementById('confirm-btn').onclick = async () => {
            const btn = document.getElementById('confirm-btn');
            btn.disabled = true;
            btn.textContent = "Securing Booking...";

            try {
                const method = document.querySelector('input[name="payment"]:checked').value;
                booking.paymentMethod = method;

                // 1. Backend Save
                const { success, token } = await ApiService.createBooking(booking);

                // 2. WhatsApp Deep Link
                const message = `🐝 *NEW BEEPILOT BOOKING*\n\n` +
                    `Ref: ${booking.id}\n` +
                    `Client: ${booking.customerName}\n` +
                    `Phone: ${booking.customerPhone}\n\n` +
                    `📍 From: ${booking.pickupLocation}\n` +
                    `🏁 To: ${booking.destination}\n` +
                    `📅 Date: ${formatDate(booking.date)}\n` +
                    `⏰ Time: ${formatTime(booking.time)}\n\n` +
                    `🚗 Type: ${booking.serviceType}\n` +
                    `👥 Pax: ${booking.passengers} | Bags: ${booking.bags}\n\n` +
                    `💰 Total: ${formatCurrency(booking.totalFare)}\n` +
                    `💳 Deposit: ${formatCurrency(booking.depositAmount)}\n` +
                    `🏧 Method: ${method.toUpperCase()}\n\n` +
                    `Please verify my payment.`;

                window.open(`${CONFIG.WHATSAPP_LINK}?text=${encodeURIComponent(message)}`, '_blank');

                // 3. Status Page
                window.location.href = `receipt.html?id=${booking.id}&token=${token}`;
            } catch (e) {
                alert("Connection error. Please try again.");
                btn.disabled = false;
                btn.textContent = "Confirm & Open WhatsApp";
            }
        };

        render();
    </script>
</body>
</html>
